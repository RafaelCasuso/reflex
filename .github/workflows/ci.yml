# RFX-003 — CI quality gates.
#
# One job, one required status check: "Quality gates". Protect `main` by
# requiring that check (GitHub → Settings → Branches/Rulesets); the workflow
# file alone cannot make itself mandatory.
#
# Rules guarded by tests/ci.test.ts:
#   - install is lockfile-frozen
#   - every gate (lint, typecheck, test, build) runs and can fail the job
#   - no `continue-on-error`, no `|| true`
#   - third-party actions are pinned to a full commit SHA
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the exact pnpm version from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        id: install
        run: pnpm install --frozen-lockfile

      # Every gate below runs even if an earlier gate failed, so one CI run
      # reports every broken gate. Any failed step still fails the job.
      - name: Lint (ESLint + Prettier)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
