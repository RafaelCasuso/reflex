# RFX-127 — signed releases.
#
# A release is a tag `vMAJOR.MINOR.PATCH` pushed to this repository, and
# nothing else: no publish from a laptop. The job builds from the tagged
# commit, runs lint, typecheck and test, sets the version from the tag
# (every open manifest and the CLI's own constant), builds, packs
# every publishable `@reflex-control/*` package once, attaches a
# build-provenance attestation to those tarballs, and publishes those same
# tarballs to npm with provenance (Sigstore, through npm's `--provenance`,
# which needs the OIDC token below). The bytes attested are the bytes
# published, so a published artifact can be verified against the commit and
# workflow that built it:
#
#   npm audit signatures
#   gh attestation verify <tarball> --repo RafaelCasuso/reflex
#
# Publishing authenticates by npm trusted publishing: the job's OIDC token,
# accepted because each package names this repository and this workflow as
# its trusted publisher on npmjs.com. No token, no secret. A package that
# has no trusted publisher yet (a new one, before its first version) cannot
# be published here: its first version is published once by the maintainer
# with their own 2FA (docs/releasing.md), then the trusted publisher is set.
#
# Rules guarded by tests/ci.test.ts:
#   - install is lockfile-frozen
#   - every gate runs before publish, and any can fail the job
#   - what is published is what was attested: pack, attest, publish, in
#     that order, on the same tarballs
#   - no `continue-on-error`, no `|| true`
#   - third-party actions are pinned to a full commit SHA
#   - `id-token: write` for provenance; nothing else is writable
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + Prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Before the build, so that what is built carries the version: the
      # manifests pnpm packs, and `rfx --version`.
      - name: Version from the tag
        run: node tools/release/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Build
        run: pnpm build

      - name: Pack every publishable package
        run: pnpm -r --filter "./packages/*" --filter "./apps/decision-gateway" exec pnpm pack --pack-destination "${RUNNER_TEMP}/tarballs"

      - name: Attest build provenance of the tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/tarballs/*.tgz

      # The tarballs just attested are what is published, one `npm publish`
      # each. `pnpm publish` would pack again, and those bytes differ from
      # the attested ones (v0.1.1: `gh attestation verify` found nothing for
      # the tarballs npm serves). `bash -e` stops at the first failure.
      #
      # No NODE_AUTH_TOKEN and no registry-url: with no token, the npm CLI
      # (11.5.1 or later; Node 24 ships it) authenticates with the job's OIDC
      # token (trusted publishing) and publishes provenance. The flag stays so
      # that a missing trusted publisher fails loudly rather than publishing
      # without provenance.
      - name: Publish the attested tarballs with provenance
        shell: bash
        run: for tarball in "${RUNNER_TEMP}"/tarballs/*.tgz; do npm publish "$tarball" --access public --provenance; done
