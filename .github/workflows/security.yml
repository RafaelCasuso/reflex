# RFX-090 — supply-chain security gates.
#
# One job, one status check: "Security gates". From Gate G1.5 on, REFLEX code
# runs inside every tool call on a developer's machine, so what ships has to be
# free of known-vulnerable dependencies and of committed secrets.
#
# Not here, on purpose: CodeQL and dependency review need GitHub Advanced
# Security, which a private repository on this plan does not have. They would
# fail on every run. Add them if the repository becomes public or gets GHAS.
#
# The same rules as ci.yml apply and are enforced by tests/ci.test.ts: actions
# pinned to a commit SHA, single-line `run` steps, nothing that swallows a
# failing exit code.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC: a dependency can become vulnerable without a commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Security gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history, so old commits are scanned too)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install gitleaks (pinned, checksum-verified)
        id: gitleaks
        run: bash .github/scripts/install-gitleaks.sh

      - name: Secret scan (every commit)
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        run: gitleaks git . --no-banner --redact --exit-code 1

      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level=high
