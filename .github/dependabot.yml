# RFX-090 — keep pinned things moving.
#
# Actions are pinned to commit SHAs (tests/ci.test.ts enforces it). A pin that
# nobody updates is a vulnerability with a delay, so Dependabot proposes the
# bumps. Every proposal goes through the required checks like any other PR.
#
# Not covered: the gitleaks version in .github/scripts/install-gitleaks.sh,
# which Dependabot cannot see. It is upgraded by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint peers on `typescript <6.1.0`, and typed linting is
      # what enforces no-any, exhaustive switches and floating promises
      # (CLAUDE.md). TypeScript 7 fails the lint gate today. Patch releases
      # of 6.0 still arrive. Lift this when typescript-eslint supports 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # The types must describe the runtime in .nvmrc (the current Node LTS),
      # not the newest Node. Bump this major together with .nvmrc, by hand.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      tooling:
        dependency-type: development
      runtime:
        dependency-type: production
